name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point the formula at this tag
        run: |
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz"
          sha=$(curl -sL "$url" | shasum -a 256 | cut -d' ' -f1)
          sed -i "s#^  url .*#  url \"$url\"#; s#^  sha256 .*#  sha256 \"$sha\"#" Formula/buzzer.rb
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -am "Formula: ${{ github.ref_name }}"
          git push
