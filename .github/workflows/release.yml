name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir dist
          tar -C target/release -czf "dist/buzzer-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz" buzzer
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.tar.gz --title "${{ github.ref_name }}" --generate-notes
      - name: Point the formula at this release
        run: |
          ./scripts/write-formula.sh "${{ github.ref_name }}" dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -am "Formula: ${{ github.ref_name }}"
          git push origin HEAD:main
